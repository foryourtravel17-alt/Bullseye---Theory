<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullseye Theory — Reset Password</title>
<style>
:root{--bg:#050b0a;--panel:#0b1815;--line:#214238;--text:#eff8f3;--muted:#91aaa1;--green:#a8ff61}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#123b31 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(470px,100%);border:1px solid var(--line);border-radius:20px;padding:30px;background:#081511}.logo{font-weight:900;letter-spacing:2px}.logo i{color:var(--green);font-style:normal}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:2px;margin-top:55px}.field{margin:15px 0}.field label{display:block;font-size:12px;color:#b6cbc3;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#06100e;color:var(--text);outline:none}.submit{width:100%;border:0;background:var(--green);color:#07100f;padding:14px;border-radius:10px;font-weight:900;cursor:pointer}.message{margin:15px 0;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.error{background:#321719;color:#ffc0c0}.success{background:#102a1c;color:#c9ffd4}.back{display:inline-block;margin-top:18px;color:var(--green);text-decoration:none;font-size:12px}
</style>
</head>
<body><main class="card"><div class="logo">◉ BULLSEYE <i>THEORY</i></div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Set a new password</h1><p style="color:var(--muted)">Choose a new password for your student account.</p><form id="form"><div class="field"><label>New password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input id="confirm" type="password" minlength="8" required></div><button class="submit">UPDATE PASSWORD</button></form><div id="msg" class="message" hidden></div><a class="back" href="auth.html">← Back to login</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const sb=supabase.createClient(window.BULLSEYE_SUPABASE_URL,window.BULLSEYE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("form"),msg=document.getElementById("msg");
form.onsubmit=async e=>{e.preventDefault();msg.hidden=true;const p=document.getElementById("password").value;const cp=document.getElementById("confirm").value;if(p.length<8||p!==cp){msg.textContent="Passwords must match and be at least 8 characters.";msg.className="message error";msg.hidden=false;return}const {error}=await sb.auth.updateUser({password:p});if(error){msg.textContent=error.message;msg.className="message error"}else{msg.textContent="Password updated successfully. You can now log in.";msg.className="message success";form.reset()}msg.hidden=false};
</script></body></html>
