name: Daily Course Integrity Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  pull_request:
    paths:
      - "supabase/admin-production.sql"
      - "supabase/migrations/**"
      - "lesson-*.html"
      - "lesson-secure-client.js"
      - ".github/workflows/course-integrity-watch.yml"
  push:
    branches: [main]
    paths:
      - "supabase/admin-production.sql"
      - "supabase/migrations/**"
      - "lesson-*.html"
      - "lesson-secure-client.js"
      - ".github/workflows/course-integrity-watch.yml"

permissions:
  contents: read

jobs:
  course-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate certificate SQL and lesson schema
        shell: bash
        run: |
          set -euo pipefail
          admin_sql="supabase/admin-production.sql"
          lesson_migration="supabase/migrations/20261025030000_align_11_lesson_schema.sql"

          test -s "$admin_sql"
          test -s "$lesson_migration"

          # Fail on malformed single-dollar PL/pgSQL openers. This is a read-only source check.
          if grep -nE '^[[:space:]]*as \$[[:space:]]*$' "$admin_sql" "$lesson_migration"; then
            echo "FAIL: malformed single-dollar function delimiter detected."
            exit 1
          fi

          grep -Fq 'as $$' "$admin_sql"
          grep -Fq 'as $$' "$lesson_migration"
          grep -Fq 'end;' "$admin_sql"
          grep -Fq '$$;' "$admin_sql"
          grep -Fq '$$;' "$lesson_migration"
          grep -Fq 'and quiz_passed = true) < 11 then' "$admin_sql"
          grep -Fq 'and quiz_passed = true) < 11 then' "$lesson_migration"

          # The shared client now owns the course-access gate for every lesson.
          secure_client="lesson-secure-client.js"
          test -s "$secure_client"
          grep -Fq 'course_access' "$secure_client"
          grep -Fq 'payment_verified' "$secure_client"
          grep -Fq 'expires_at' "$secure_client"
          grep -Fq 'lesson_progress' "$secure_client"

          lesson_count=0
          for lesson in lesson-[0-9]*.html; do
            test -s "$lesson"
            number="${lesson#lesson-}"
            number="${number%.html}"
            grep -Fq "lesson-secure-client.js\" data-lesson-number=\"$number\"" "$lesson"
            lesson_count=$((lesson_count + 1))
          done
          test "$lesson_count" -ge 11

          echo "PASS: SQL delimiters, 11-lesson certificate threshold, and shared access gate across $lesson_count lesson pages are present."
