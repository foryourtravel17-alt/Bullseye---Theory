name: Course Runtime Checks

on:
  pull_request:
    paths:
      - "server.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/course-runtime-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run site and course runtime tests
        run: npm test
