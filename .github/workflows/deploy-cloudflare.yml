# Cloudflare production deployment
name: Deploy Bullseye Theory to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test deployed public pages and unknown routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://bullseye-theory.foryourtravel17.workers.dev"
          check_page() {
            local path="$1"
            local expected="$2"
            local body
            body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "$base/$path")"
            if ! grep -Fqi "$expected" <<<"$body"; then
              echo "::error::Smoke test failed for /$path: expected page marker not found"
              return 1
            fi
            echo "PASS /$path"
          }
          check_unknown_route() {
            local path="$1"
            local body_file="$2"
            local status
            status="$(curl --silent --show-error --location --output "$body_file" --write-out "%{http_code}" "$base/$path")"
            if [[ "$status" != "404" ]]; then
              echo "::error::Unknown route /$path expected HTTP 404, got $status"
              return 1
            fi
            if ! grep -Fqi "Page not found" "$body_file"; then
              echo "::error::Unknown route /$path did not return the branded 404 page"
              return 1
            fi
            echo "PASS /$path returns HTTP 404 with branded page"
          }

          check_page "index.html" "READ THE MARKET"
          check_page "auth.html" "Student Login"
          check_page "dashboard.html" "Student Dashboard"
          check_page "admin.html" "BULLSEYE THEORY — ADMIN"
          check_page "payment.html" "Choose your"
          check_page "terms.html" "Terms of Use"
          check_page "refund.html" "Refund Information"
          check_page "membership.html" "ENROLLMENT CLOSED"

          # Test both path shapes: SPA-like extensionless routes and file-like routes.
          check_unknown_route "automation-probe-does-not-exist" "/tmp/bullseye-404-extensionless.html"
          check_unknown_route "automation-probe-does-not-exist.html" "/tmp/bullseye-404-extension.html"
