# Cloudflare production deployment
name: Deploy Bullseye Theory to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run full production pre-deploy safety checks
        run: bash scripts/cloudflare-predeploy-checks.sh

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test deployed public pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://bullseye-theory.foryourtravel17.workers.dev"
          check_page() {
            local path="$1"
            local expected="$2"
            local body
            body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "$base/$path")"
            if ! grep -Fqi "$expected" <<<"$body"; then
              echo "::error::Smoke test failed for /$path: expected page marker not found"
              return 1
            fi
            echo "PASS /$path"
          }
          check_page "index.html" "READ THE MARKET"
          check_page "gateway.html" "Official Bullseye Theory Hub"
          check_page "auth.html" "Student Login"
          check_page "dashboard.html" "Student Dashboard"
          check_page "admin.html" "BULLSEYE THEORY — ADMIN"
          check_page "payment.html" "Manual Course Activation"
          check_page "terms.html" "Terms of Use"
          check_page "refund.html" "Refund Information"
          check_page "membership.html" "ENROLLMENT CLOSED"

          check_unknown_route() {
            local path="$1"
            local body_file
            body_file="$(mktemp)"
            local status
            status="$(curl --silent --show-error --location --output "$body_file" --write-out "%{http_code}" "$base/$path")"
            if [[ "$status" != "404" ]]; then
              echo "::error::Unknown route /$path expected HTTP 404, got $status"
              cat "$body_file"
              rm -f "$body_file"
              return 1
            fi
            if ! grep -Fqi "Page not found" "$body_file"; then
              echo "::error::Unknown route /$path did not return the branded 404 page"
              cat "$body_file"
              rm -f "$body_file"
              return 1
            fi
            rm -f "$body_file"
            echo "PASS /$path returns branded HTTP 404"
          }
          check_unknown_route "bullseye-unknown-route-probe"
          check_unknown_route "bullseye-unknown-route-probe.html"
