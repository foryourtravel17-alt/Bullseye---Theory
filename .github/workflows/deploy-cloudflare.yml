# Cloudflare production deployment
name: Deploy Bullseye Theory to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test deployed public pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://bullseye-theory.foryourtravel17.workers.dev"
          check_page() {
            local path="$1"
            local expected="$2"
            local body
            body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "$base/$path")"
            if ! grep -Fqi "$expected" <<<"$body"; then
              echo "::error::Smoke test failed for /$path: expected page marker not found"
              return 1
            fi
            echo "PASS /$path"
          }
          check_page "index.html" "READ THE MARKET"
          check_page "auth.html" "Student Login"
          check_page "dashboard.html" "Student Dashboard"
          check_page "admin.html" "BULLSEYE THEORY — ADMIN"
          check_page "payment.html" "Choose your"
          check_page "terms.html" "Terms of Use"
          check_page "refund.html" "Refund Information"
          check_page "membership.html" "ENROLLMENT CLOSED"

          # Verify both the branded body and the actual HTTP status for unknown routes.
          status="$(curl --silent --show-error --location --output /tmp/bullseye-404.html --write-out "%{http_code}" "$base/automation-probe-does-not-exist.html")"
          if [[ "$status" != "404" ]]; then
            echo "::error::Unknown-route smoke test expected HTTP 404, got $status"
            exit 1
          fi
          if ! grep -Fqi "Page not found" /tmp/bullseye-404.html; then
            echo "::error::Unknown-route smoke test did not find the branded 404 marker"
            exit 1
          fi
          echo "PASS unknown route returns HTTP 404 with branded page"
