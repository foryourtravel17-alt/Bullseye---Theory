name: Launch Page Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.html"
      - "scripts/check_launch_pages.py"
      - ".github/workflows/launch-page-check.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/check_launch_pages.py"
      - ".github/workflows/launch-page-check.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  launch-page-check:
    name: Validate launch pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate pages and local links
        run: python scripts/check_launch_pages.py
