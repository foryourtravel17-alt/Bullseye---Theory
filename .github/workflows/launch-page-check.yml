name: Launch Page Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "*.html"
      - "scripts/check_launch_pages.py"
      - "payment-checkout.js"
      - "package.json"
      - "tests/**"
      - "indicator/**"
      - ".github/workflows/launch-page-check.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/check_launch_pages.py"
      - "payment-checkout.js"
      - "package.json"
      - "tests/**"
      - "indicator/**"
      - ".github/workflows/launch-page-check.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  launch-page-check:
    name: Validate launch pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate pages and local links
        run: python scripts/check_launch_pages.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run course contract and site tests
        run: npm test
      - name: Install indicator dependencies
        working-directory: indicator
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run deterministic indicator and analyzer integration tests
        working-directory: indicator
        run: npm test
      - name: Check indicator server syntax
        working-directory: indicator
        run: node --check server.mjs
