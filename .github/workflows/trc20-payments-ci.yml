name: TRC20 Payment Checks

on:
  pull_request:
    paths:
      - "payment.html"
      - "payment-checkout.js"
      - "assets/usdt-tron-mainnet-trc20.svg"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - ".github/workflows/trc20-payments-ci.yml"
      - ".github/workflows/trc20-payment-scan.yml"
  push:
    branches: [main]
    paths:
      - "payment.html"
      - "payment-checkout.js"
      - "assets/usdt-tron-mainnet-trc20.svg"
      - "supabase/functions/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate payment browser script syntax
        run: node --check payment-checkout.js
      - name: Verify legacy checkout guard remains closed and no-network
        run: node scripts/check-payment-checkout-closed-order.mjs
      - name: Validate payment migration structure and privileges
        run: node scripts/validate-trc20-migration.mjs
      - name: Validate separate annual indicator entitlement contract
        run: node scripts/validate-indicator-entitlement.mjs
      - name: Test strict TRC-20 matching and settlement rules
        run: deno test supabase/functions/_shared/trc20.test.ts
      - name: Test fixed product price and duration contracts
        run: deno test supabase/functions/_shared/product-plans.test.ts
      - name: Test authoritative course progress and quiz attempt write permissions
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE course_progress_security_test"
          COURSE_DATABASE_URL="${DATABASE_URL%/postgres}/course_progress_security_test"
          DATABASE_URL="$COURSE_DATABASE_URL" bash scripts/test-course-progress-security-postgres.sh
      - name: Run migrations and 85-day settlement tests in disposable PostgreSQL
        run: bash scripts/test-trc20-migration-postgres.sh
      - name: Type-check payment Edge Functions
        run: |
          deno check supabase/functions/create-trc20-order/index.ts
          deno check supabase/functions/get-trc20-order-status/index.ts
          deno check supabase/functions/get-trc20-payment-config/index.ts
          deno check supabase/functions/get-indicator-access/index.ts
          deno check supabase/functions/scan-trc20-payments/index.ts

# The disposable course-progress security regression is part of this workflow; no live DB is used.
