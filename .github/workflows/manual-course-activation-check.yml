name: Manual Course Activation Checks

on:
  pull_request:
    paths:
      - "payment.html"
      - "admin.html"
      - "auth.html"
      - "dashboard.html"
      - "membership.html"
      - "scripts/check-manual-course-activation.sh"
      - ".github/workflows/manual-course-activation-check.yml"
  push:
    branches: ["main"]
    paths:
      - "payment.html"
      - "admin.html"
      - "auth.html"
      - "dashboard.html"
      - "membership.html"
      - "scripts/check-manual-course-activation.sh"
      - ".github/workflows/manual-course-activation-check.yml"

permissions:
  contents: read

jobs:
  manual-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify no online payment fields and manual admin flow
        run: bash scripts/check-manual-course-activation.sh
