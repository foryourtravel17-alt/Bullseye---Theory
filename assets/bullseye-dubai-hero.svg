<path d="M365 575 Q450 535 535 575 L555 730 Q500 785 450 790 Q400 785 345 730Z" fill="url(#gold2)" stroke="#f8d46e" stroke-width="5"/>
<path d="M410 585L430 710M490 585L470 710" stroke="#fff0a0" stroke-width="4" opacity=".45"/>
