<!-- chin -->
<path d="M365 820Q450 875 535 820Q520 905 450 920Q380 905 365 820Z" fill="url(#darkGold)" stroke="#d8a33b" stroke-width="4"/>
<!-- HUD labels -->
<g font-family="Arial, sans-serif" letter-spacing="4" fill="#d7e2dc"><text x="450" y="1020" font-size="14" text-anchor="middle">DUBAI MARKET DESK  /  FX · CRYPTO · STRUCTURE</text></g>
<!-- particles -->
<g fill="#a8ff61">
 <circle cx="150" cy="250" r="3"><animate attributeName="cy" values="250;220;250" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="750" cy="260" r="3"><animate attributeName="cy" values="260;225;260" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="180" cy="560" r="2"><animate attributeName="cy" values="560;525;560" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="720" cy="600" r="2"><animate attributeName="cy" values="600;565;600" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
