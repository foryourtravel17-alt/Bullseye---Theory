<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".22" stop-color="#c88a21"/><stop offset=".48" stop-color="#ffe39a"/><stop offset=".7" stop-color="#8e5b0d"/><stop offset="1" stop-color="#f5c95f"/></linearGradient>
 <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5bc"/><stop offset=".28" stop-color="#d99b2b"/><stop offset=".58" stop-color="#6f4308"/><stop offset="1" stop-color="#dca73c"/></linearGradient>
 <linearGradient id="darkGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c1b04"/><stop offset=".5" stop-color="#a66b12"/><stop offset="1" stop-color="#241504"/></linearGradient>
 <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff3b00"/><stop offset=".45" stop-color="#ffb000"/><stop offset=".7" stop-color="#fff3a1"/><stop offset="1" stop-color="#ff4b00"/></linearGradient>
 <radialGradient id="bg"><stop stop-color="#17352e"/><stop offset=".55" stop-color="#07100e"/><stop offset="1" stop-color="#010304"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="fireGlow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="headClip"><path d="M260 470 Q300 350 450 325 Q600 350 640 470 L620 720 Q585 850 450 900 Q315 850 280 720Z"/></clipPath>
</defs>
<rect width="900" height="1100" fill="url(#bg)"/>
