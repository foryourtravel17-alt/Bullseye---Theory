 <path d="M580 550 Q545 525 505 552 Q540 585 578 563Z" fill="#fff4b0" stroke="#ff7b00" stroke-width="6"/>
</g>
<g class="eyeFire" fill="url(#fire)" filter="url(#fireGlow)">
 <path d="M318 557 Q270 525 235 545 Q270 555 285 580 Q245 585 215 610 Q275 595 320 575Z">
  <animateTransform attributeName="transform" type="scale" values="1 .9;1 1.12;1 .95;1 1" dur=".75s" repeatCount="indefinite"/>
 </path>
 <path d="M582 557 Q630 525 665 545 Q630 555 615 580 Q655 585 685 610 Q625 595 580 575Z">
  <animateTransform attributeName="transform" type="scale" values="1 .9;1 1.12;1 .95;1 1" dur=".75s" repeatCount="indefinite"/>
 </path>
</g>
