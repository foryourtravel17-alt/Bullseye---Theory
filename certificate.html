<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate — Bullseye Theory</title><style>body{margin:0;background:#050806;color:#eef8f0;font:16px Arial}.wrap{max-width:900px;margin:40px auto;padding:20px}.cert{border:1px solid #20e06a;padding:50px;text-align:center;background:#0b120e;border-radius:20px}.green{color:#20e06a}.id{color:#91a69a}</style></head><body><main class="wrap"><div class="cert"><p class="green">BULLSEYE THEORY</p><h1>CERTIFICATE OF COMPLETION</h1><p id="name">Loading…</p><p>has completed the Bullseye Theory trading education course.</p><p class="id" id="id"></p><p class="id" id="date"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(BULLSEYE_SUPABASE_URL,BULLSEYE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true}});(async()=>{const s=await sb.auth.getSession();if(!s.data.session){location.href="auth.html";return}const u=s.data.session.user;const c=await sb.from("certificates").select("*").eq("user_id",u.id).maybeSingle();if(!c.data){document.getElementById("name").textContent="Certificate not issued yet.";return}document.getElementById("name").textContent=c.data.student_name;document.getElementById("id").textContent="Certificate ID: "+c.data.certificate_id;document.getElementById("date").textContent=new Date(c.data.issued_at).toLocaleDateString()})();</script></body></html>
