<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate — Bullseye Theory</title>
<style>
:root{--bg:#050806;--panel:#0b120e;--line:#20a65a;--text:#eef8f0;--muted:#91a69a;--green:#a8ff61;--gold:#e4b957}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123b31 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif;display:grid;place-items:center;padding:20px}
.wrap{width:min(100%,960px);margin:24px auto}
.cert{position:relative;border:2px solid var(--line);padding:clamp(28px,7vw,72px);text-align:center;background:linear-gradient(145deg,#0b1812,#07100b);border-radius:20px;box-shadow:0 30px 90px #0008}
.cert:before{content:"";position:absolute;inset:12px;border:1px solid #e4b95766;border-radius:12px;pointer-events:none}
.brand{color:var(--green);font-weight:900;letter-spacing:3px}
.eyebrow{color:var(--gold);font:800 11px/1.4 monospace;letter-spacing:2px;margin-top:32px}
h1{font-size:clamp(30px,6vw,58px);line-height:1.05;margin:16px 0}
#name{font-size:clamp(24px,4vw,38px);color:var(--green);font-weight:700;margin:28px 0 8px}
.id{color:var(--muted);font:12px/1.6 monospace;letter-spacing:1px}
#status{text-align:center;color:var(--muted);margin:18px 0}
#printButton{display:block;margin:18px auto;padding:12px 18px;border:1px solid var(--green);border-radius:8px;background:var(--green);color:#07100f;font-weight:800;cursor:pointer}
@media print{body{background:#fff;color:#101510;padding:0}.wrap{margin:0;width:100%}.cert{box-shadow:none;border:3px solid #16884a;border-radius:0;background:#fff;color:#101510;min-height:95vh;display:flex;flex-direction:column;justify-content:center}.cert:before{border-color:#c29a3b}.brand,#name{color:#16884a}#printButton,#status{display:none!important}.id{color:#4c6255}}
</style>
</head>
<body>
<main class="wrap">
  <div class="cert">
    <p class="brand">BULLSEYE THEORY</p>
    <div class="eyebrow">VERIFIED COURSE COMPLETION</div>
    <h1>CERTIFICATE OF COMPLETION</h1>
    <p id="name">Verifying student…</p>
    <p>has completed the 11-lesson Bullseye Theory trading education curriculum, including the required knowledge checks.</p>
    <p class="id" id="id"></p>
    <p class="id" id="date"></p>
  </div>
  <p id="status" role="status" aria-live="polite">Verifying course completion…</p>
  <button id="printButton" type="button" hidden>Print / Save as PDF</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb = supabase.createClient(BULLSEYE_SUPABASE_URL, BULLSEYE_SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
document.getElementById("printButton").addEventListener("click", () => window.print());
(async () => {
  const { data: { session }, error: sessionError } = await sb.auth.getSession();
  if (sessionError || !session) { location.href = "auth.html"; return; }

  const { data: certificateCode, error: issueError } = await sb.rpc("issue_my_certificate");
  if (issueError) {
    document.getElementById("name").textContent = "Certificate not ready yet.";
    document.getElementById("status").textContent =
      "Complete all 11 lessons and pass all 11 quizzes while course access is active to claim your certificate.";
    return;
  }

  const { data, error } = await sb.from("certificates")
    .select("student_name,certificate_id,issued_at")
    .eq("user_id", session.user.id)
    .maybeSingle();
  if (error || !data || data.certificate_id !== certificateCode) {
    document.getElementById("name").textContent = "Certificate could not be loaded.";
    document.getElementById("status").textContent = "Please refresh or contact support.";
    return;
  }

  document.getElementById("name").textContent = data.student_name;
  document.getElementById("id").textContent = "Certificate ID: " + data.certificate_id;
  document.getElementById("date").textContent = "Issued: " + new Date(data.issued_at).toLocaleDateString();
  document.getElementById("status").textContent = "All 11 lesson completions and quiz passes verified.";
  document.getElementById("printButton").hidden = false;
})();
</script>
</body>
</html>
