<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bullseye Theory Admin</title><style>body{margin:0;background:#050806;color:#eef8f0;font:16px Arial}.wrap{max-width:1000px;margin:auto;padding:30px} .card{background:#0b120e;border:1px solid #17351f;border-radius:16px;padding:20px;margin:15px 0}.id{font-size:11px;color:#91a69a;word-break:break-all}.green{color:#20e06a}button{padding:10px 14px;background:#20e06a;border:0;border-radius:9px;font-weight:bold}input{padding:10px;background:#07100b;border:1px solid #17351f;color:white;border-radius:8px;width:90%}</style></head><body><main class="wrap"><h1 class="green">BULLSEYE THEORY — ADMIN</h1><p id="status">Checking admin access…</p><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const sb=supabase.createClient(BULLSEYE_SUPABASE_URL,BULLSEYE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
async function init(){
  const s=await sb.auth.getSession();
  if(!s.data.session){location.href="auth.html";return}
  const u=s.data.session.user;
  const p=await sb.from("profiles").select("is_admin,full_name").eq("id",u.id).maybeSingle();
  if(p.error||!p.data?.is_admin){$("status").textContent="Admin access not enabled for this account.";return}
  $("status").textContent="Admin access active.";
  const [a,pf]=await Promise.all([
    sb.from("course_access").select("user_id,is_active,payment_verified,expires_at").order("user_id"),
    sb.from("profiles").select("id,full_name").order("full_name")
  ]);
  if(a.error){$("status").textContent="Could not load students: "+a.error.message;return}
  const names=new Map((pf.data||[]).map(x=>[x.id,x.full_name||"Student"]));
  $("list").innerHTML=(a.data||[]).map(x=>{
    const name=names.get(x.user_id)||"Student";
    return '<div class="card"><h3>'+name+'</h3><p class="id">'+x.user_id+'</p><p>Active: <b>'+x.is_active+'</b> · Payment verified: <b>'+x.payment_verified+'</b></p><p>Expiry: '+(x.expires_at?new Date(x.expires_at).toLocaleString():"No expiry")+'</p><button onclick="activate(\''+x.user_id+'\')">ACTIVATE</button> <button onclick="deactivate(\''+x.user_id+'\')">DEACTIVATE</button> <button onclick="issueCertificate(\''+x.user_id+'\')">ISSUE CERTIFICATE</button></div>';
  }).join("")||"<div class='card'>No student accounts yet.</div>";
}
async function activate(id){
  const {error}=await sb.from("course_access").update({is_active:true,payment_verified:true}).eq("user_id",id);
  if(error){alert(error.message);return} location.reload();
}
async function deactivate(id){
  const {error}=await sb.from("course_access").update({is_active:false}).eq("user_id",id);
  if(error){alert(error.message);return} location.reload();
}
async function issueCertificate(id){
  const {data,error}=await sb.rpc("issue_certificate",{target_user:id});
  if(error){alert("Certificate not issued: "+error.message);return}
  alert("Certificate issued: "+data);
}
init();
</script></body></html>
