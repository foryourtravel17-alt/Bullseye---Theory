<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bullseye Theory Admin</title><style>body{margin:0;background:#050806;color:#eef8f0;font:16px Arial}.wrap{max-width:1000px;margin:auto;padding:30px}.card{background:#0b120e;border:1px solid #17351f;border-radius:16px;padding:20px;margin:15px 0}.green{color:#20e06a}button{padding:10px 14px;background:#20e06a;border:0;border-radius:9px;font-weight:bold}input{padding:10px;background:#07100b;border:1px solid #17351f;color:white;border-radius:8px;width:90%}</style></head><body><main class="wrap"><h1 class="green">BULLSEYE THEORY — ADMIN</h1><p id="status">Checking admin access…</p><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(BULLSEYE_SUPABASE_URL,BULLSEYE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href="auth.html";return}const u=s.data.session.user;const p=await sb.from("profiles").select("is_admin").eq("id",u.id).maybeSingle();if(!p.data?.is_admin){document.getElementById("status").textContent="Admin access not enabled for this account.";return}document.getElementById("status").textContent="Admin access active.";const q=await sb.from("course_access").select("user_id,is_active,payment_verified,expires_at").order("user_id");document.getElementById("list").innerHTML=(q.data||[]).map(x=>'<div class="card"><b>'+x.user_id+'</b><p>Active: '+x.is_active+' · Payment verified: '+x.payment_verified+'</p><button onclick="activate(\''+x.user_id+'\')">ACTIVATE</button> <button onclick="deactivate(\''+x.user_id+'\')">DEACTIVATE</button></div>').join("")}async function activate(id){await sb.from("course_access").update({is_active:true,payment_verified:true}).eq("user_id",id);location.reload()}async function deactivate(id){await sb.from("course_access").update({is_active:false}).eq("user_id",id);location.reload()}init();</script></body></html>
